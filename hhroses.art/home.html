    <script>
      // startup sound effect
      document.addEventListener('DOMContentLoaded', function () {
        console.log('Referrer is:', document.referrer);
        const allowedReferrer = "https://hhroses.neocities.org/windows-startup";
        const audio = document.getElementById('my-audio');
        if (document.referrer === allowedReferrer) {
          audio.play().catch(function(e){
            console.log("Autoplay blocked; user interaction required.");
          });
        }
      });      
      // for music player
      document.addEventListener('DOMContentLoaded', function() {
        const ipod = document.querySelector('.divmusicplayer');
        if (!ipod) return;
        ipod.classList.remove('mydiv'); 
        ipod.onmousedown = null;  // Remove dragElement's handler
        document.body.appendChild(ipod);
        const ipodImage = ipod.querySelector('.ipod-image');
        let isDragging = false;
        let startX, startY, initialX, initialY;
        function bringToFront() {
          const elements = document.querySelectorAll('body *');
          let maxZ = 0;
          elements.forEach(el => {
            const z = parseInt(window.getComputedStyle(el).zIndex);
            if (!isNaN(z) && z > maxZ) maxZ = z;
          });
          ipod.style.setProperty('z-index', maxZ + 10, 'important');
        }
        ipodImage.addEventListener('mousedown', function(e) {
          e.preventDefault();
          isDragging = true;
          ipodImage.style.cursor = 'grabbing';
          bringToFront();
          const style = window.getComputedStyle(ipod);
          const matrix = new DOMMatrixReadOnly(style.transform);
          initialX = parseFloat(style.left) || 0;
          initialY = parseFloat(style.top) || 0;
          startX = e.clientX;
          startY = e.clientY;
          ipod.style.transition = 'none';
        });
        document.addEventListener('mousemove', function(e) {
          if (!isDragging) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          ipod.style.left = (initialX + dx) + 'px';
          ipod.style.top = (initialY + dy) + 'px';
        });
        document.addEventListener('mouseup', function() {
          if (isDragging) {
            isDragging = false;
            ipodImage.style.cursor = 'grab';
            ipod.style.transition = 'transform 0.3s ease';
          }
        });
      });
      window.addEventListener('load', function() {
        var layouts = {
          wide: {
            '.homepage':      { left: 'calc(50vw - 315px)', top: 'calc(50vh - 282px)' },
            '.WelcomeWindow': { left: 'calc(50vw + 440px)', top: 'calc(50vh - 300px)' },
            '.soulart':       { left: 'calc(50vw + 200px)', top: 'calc(50vh - 345px)' },
            '.chat':          { left: 'calc(50vw - 670px)', top: 'calc(50vh - 150px)' },
            '.MSPaintwindow': { left: 'calc(50vw - 500px)', top: 'calc(50vh - 335px)' },
            '.divmusicplayer':{ left: 'calc(50vw + 300px)', top: 'calc(50vh + 30px)'  }
          },
          narrow: {
            '.homepage':      { left: 'calc(50vw - 315px)', top: 'calc(50vh - 282px)' },
            '.WelcomeWindow': { left: 'calc(50vw + 340px)', top: 'calc(50vh - 360px)' },
            '.soulart':       { left: 'calc(50vw + 200px)', top: 'calc(50vh - 345px)' },
            '.chat':          { left: 'calc(50vw - 555px)', top: 'calc(50vh - 200px)' },
            '.MSPaintwindow': { left: 'calc(50vw - 450px)', top: 'calc(50vh - 335px)' },
            '.divmusicplayer':{ left: 'calc(50vw + 220px)', top: 'calc(50vh + 30px)'  }
          }
        };
        function applyLayout() {
          var positions = window.innerWidth <= 1478 ? layouts.narrow : layouts.wide;
          for (var selector in positions) {
            var els = document.querySelectorAll(selector);
            var el = els[els.length - 1]; 
            if (!el) continue;
            if (el.dataset.userMoved === 'true') continue; 
            var props = positions[selector];
            for (var prop in props) el.style[prop] = props[prop];
            if (!el.dataset.dragListenerAttached) {
              el.dataset.dragListenerAttached = 'true';
              var grabTarget = el.classList.contains('divmusicplayer')
                ? el.querySelector('.ipod-image')  // ipod drags from the image.. might add more
                : el.querySelector('.title-bar');  // regular windows drag from title bar
              if (grabTarget) {
                var mark = function() { el.dataset.userMoved = 'true'; };
                grabTarget.addEventListener('mousedown', mark);
                grabTarget.addEventListener('touchstart', mark);
              }
            }
          }
        }
        setTimeout(applyLayout, 50);
        window.addEventListener('resize', applyLayout);
      });
      // so new apps overlap the fairyart etc
      document.querySelectorAll('.tooth1, .tooth2, .tooth3, .tooth4').forEach(function(tooth) {
        tooth.addEventListener('mousedown', function() {
          if (tooth.getAnimations().length > 0) {
            var computed = window.getComputedStyle(tooth);
            tooth.style.top = computed.top;
            tooth.style.left = computed.left;
            tooth.style.transform = computed.transform;
            tooth.style.zIndex = computed.zIndex;
            tooth.style.animation = 'none';
          }
        });
      });   
      // Reset scroll when crossing the mobile/desktop breakpoint
      let wasMobileLayout = window.innerWidth <= 780;
      window.addEventListener('resize', function() {
        var isMobileLayout = window.innerWidth <= 780;
        if (wasMobileLayout !== isMobileLayout) {
          window.scrollTo(0, 0);
        }
        wasMobileLayout = isMobileLayout;
      });
