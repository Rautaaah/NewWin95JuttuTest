  <body>
    <h1>Your Trophies</h1>
    <p>You can earn trophies by exploring the site and playing games!</p>
    
    <!-- trophy case -->
    <div id="trophy-case" style="display: flex; gap: 20px; flex-wrap: wrap;"></div>
    <br>
    <center>
      <button style="font-family: 'basiic';" onclick="unlockAchievement('button_clicker', 'Curious Clicker', '🖱️','Clicked on the button','general', '../../audio/goblin/daviddumaisaudio-small-monster-attack-195712.mp3')">Don't Click Me</button>
      <br><br>
      <button style="font-family: 'basiic';" class="secretBtn" onclick="unlockAchievement('clicker_2', 'Master Clicker', '../../images/icons/winxp-doge-16x16.png', 'Found the secret button', 'general')">SECRET button</button>
      <br><br>
      <button style="font-family: 'basiic';" class="secretBtn" onclick="resetTrophies()" style="padding: 5px 10px; background: red; color: white; border: none; cursor: pointer; border-radius: 5px; ">Debug: Reset Trophies</button>
      <br>
      <br>
      <span class="secretBtn">  
        <p>Cheat Codes:</p>
        <div style="display:flex;gap:10px;justify-content:center;align-items:center;">
          <input type="text" id="cheatInput" placeholder="Enter trophy ID(s), comma-separated..."
                 style="font-family:'basiic',sans-serif;"
                 onkeydown="if(event.key==='Enter'){redeemCheatCode(this.value); this.value='';}">
          <button onclick="redeemCheatCode(document.getElementById('cheatInput').value); document.getElementById('cheatInput').value='';"
                  style="height:20px;font-family: 'basiic';">Redeem</button>
        </div>
      </span>
    </center>
    <script src="trophy_list.js"></script>
    <script>
      function getTrophies() {
        let trophies = [];
        try {
            trophies = JSON.parse(localStorage.getItem('my_site_trophies')) || [];
            if (!Array.isArray(trophies)) trophies = [];
        } catch (error) {
            console.error("Corrupted trophy data found! Wiping clean...", error);
            localStorage.removeItem('my_site_trophies');
        }
        return trophies;
      } 
      function unlockAchievement(id, name, icon, description, category = 'general', soundUrl = null) {
        let trophies = getTrophies();
        let alreadyUnlocked = trophies.some(trophy => trophy.id === id); 
        if (!alreadyUnlocked) { 
          trophies.push({ 
              id: id, 
              name: name, 
              icon: icon, 
              description: description, 
              category: category,
              soundUrl: soundUrl
          }); 
          localStorage.setItem('my_site_trophies', JSON.stringify(trophies));
          showNotification(name, icon, soundUrl);
          renderTrophyCase();
        }
      }
      function redeemCheatCode(input) {
        const ids = (input || '').split(',').map(s => s.trim()).filter(Boolean);
        if (ids.length === 0) return;
      
        const owned = [];
        const notFound = [];
        const unlocked = [];
      
        ids.forEach(id => {
          const t = TROPHY_LIST[id];
          if (!t) { notFound.push(id); return; }
          if (getTrophies().some(trophy => trophy.id === id)) { owned.push(id); return; }
          unlockAchievement(id, t.name, t.icon, t.description, t.category, t.soundUrl);
          unlocked.push(id);
        });
      
        let msg = [];
        if (unlocked.length) msg.push('Unlocked: ' + unlocked.join(', '));
        if (owned.length) msg.push('Already owned: ' + owned.join(', '));
        if (notFound.length) msg.push('Not found: ' + notFound.join(', '));
        if (owned.length || notFound.length) alert(msg.join('\n'));
      }
      function getToastDoc() {
        try {
          // same-origin iframe? target the top window so the toast isn't trapped in the iframe box
          if (window.top && window.top !== window && window.top.document) {
            return window.top.document;
          }
        } catch (e) {
          // cross-origin iframe, can't reach window.top — fall back to rendering locally
        }
        return document;
      }
      function ensureToastStyles(doc) {
        if (doc.getElementById('achievement-toast-styles')) return;
        const style = doc.createElement('style');
        style.id = 'achievement-toast-styles';
        style.textContent = `
          .achievement-toast {
            position: fixed; top: -100px; left: 20px;
            background: #4f4f51; color: #fff; padding: 15px 25px; border-radius: 5px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 3px 1px #393044, 0 1px 3px rgba(0,0,0,0.9);
            transition: top 0.5s ease-in-out; z-index: 99999999999 !important;
            font-family: 'basiic', sans-serif; border: 1px solid #393044;
            width: 250px !important; height: 50px !important;
          }
          .achievement-toast.show { top: 20px; }
          .achievement-toast .icon {
            font-size: 30px; margin-left: -5px; margin-right: -10px; border: none;
            text-shadow: 1px 1px #393044, -1px 1px #393044, 1px -1px #393044, -1px -1px #393044;
            -webkit-box-reflect: below -8px linear-gradient(to bottom, transparent 50%, rgba(255,255,255,1));
          }
          .achievement-toast .icon img {
            min-width: 50px; min-height: 50px; max-width: 100px; max-height: 50px;
            object-fit: contain; vertical-align: middle; border: none;
          }
          .achievement-toast p { margin: 0 auto; text-align: center;
            text-shadow: 1px 1px #393044, -1px 1px #393044, 1px -1px #393044, -1px -1px #393044; }
          .achievement-toast p strong {
            margin-top: 3px; display: block; font-size: 14px; width: 100%; color: #FFD700;
            text-shadow: 1px 1px #393044, -1px 1px #393044, 1px -1px #393044, -1px -1px #393044;
            line-height: 17px; text-align: center;
          }
        `;
        doc.head.appendChild(style);
      }
      function showNotification(name, icon, soundUrl) {
        const defaultSound = '../../audio/notifications/xbox-360-achievement-sound.mp3';
        const ding = new Audio(defaultSound);
        ding.play().catch(error => console.log("Browser blocked auto-play"));
      
        const formattedIcon = formatIcon(icon);
        const targetDoc = getToastDoc();
        ensureToastStyles(targetDoc);
      
        const toast = targetDoc.createElement('div');
        toast.className = 'achievement-toast';
        toast.innerHTML = `
          <span class="icon">${formattedIcon}</span> 
          <p>Achievement Unlocked!<br><strong>${name}</strong></p>
        `;
        targetDoc.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 100);
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 500);
        }, 4000);
      }
      function playTrophySound(soundUrl) {
        const defaultSound = '../../audio/notifications/xbox-360-achievement-sound.mp3';
        const finalSound = (soundUrl && soundUrl !== 'undefined' && soundUrl !== 'null') ? soundUrl : defaultSound;
        
        const audio = new Audio(finalSound);
        audio.play().catch(error => console.log("Browser blocked auto-play"));
      
        // Check for the custom time limit in the URL and pause it
        if (finalSound.includes('?playFor=')) {
          const seconds = parseFloat(finalSound.split('?playFor=')[1]);
          setTimeout(() => {
            audio.pause();
          }, seconds * 1000);
        }
      }
      function renderTrophyCase() {
        const caseDiv = document.getElementById('trophy-case');
        if (!caseDiv) return;
        const savedTrophies = getTrophies();
        caseDiv.innerHTML = ""; // Wipe current HTML
    
        if (savedTrophies.length === 0) {
          caseDiv.innerHTML = "<p>You haven't earned any trophies yet. Keep exploring!</p>";
          return;
        }
    
        // Group trophies by category
        const groups = {};
        savedTrophies.forEach(trophy => {
          const cat = trophy.category || 'general';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(trophy);
        });
    
        // Build one card per category
        Object.keys(groups).forEach(category => {
          let figuresHtml = "";
          groups[category].forEach(trophy => {
            const formattedIcon = formatIcon(trophy.icon);
            figuresHtml += `
              <div class="trophy-figure" onclick="playTrophySound('${trophy.soundUrl}')">
                  <div class="trophyIcon">${formattedIcon}</div>
                  <strong class="trophyName">${trophy.name}</strong>
                  <p class="trophyDescription">${trophy.description || 'No description available.'}</p>
              </div>
            `;
          });
    
          caseDiv.innerHTML += `
            <div class="trophy-card ${category}">
              <h2 class="category-title">${category}</h2>
              <div class="trophy-group" style="display: flex; column-gap: 15px; row-gap: 5px; flex-wrap: wrap; justify-content: center;">
                ${figuresHtml}
              </div>
            </div>
          `;
        });
    }
      function resetTrophies() {
          let areYouSure = confirm("Are you sure you want to delete all your trophies? This cannot be undone!");
          if (areYouSure) {
              localStorage.removeItem('my_site_trophies');
              renderTrophyCase();
          }
      }
      renderTrophyCase();
    </script>
