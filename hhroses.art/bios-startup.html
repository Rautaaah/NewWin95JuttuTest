    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }
      .fuzzy-overlay {
        position: absolute;
        inset: -200%;
        background-image: url("images/noise2.jpg");
        opacity: 25%;
        z-index: 0;
        pointer-events: none;
        animation: shift 0.2s linear infinite both;
      }  
      @keyframes shift {
        0% {
          transform: translateX(10%) translateY(10%);
        }
        100% {
          transform: translateX(-10%) translateY(-10%);
        }
      }
      html, body { cursor: none; }
      body {
        background-color: black !important;
        overflow: hidden !important;
        height: 100% !important;
        width: 100% !important;      
        margin: 0 !important ;
        padding: 0 !important;          
      }
      .background {
        position: absolute;
        height: calc(100% - 20px);
        width: calc(100% - 20px);
        margin: 10px;        
        background-image: url('images/STARTUPS/Matrix_mode_3_CPCBasic.gif');
        background-size: repeat;
        border-radius: 25px !important;
        z-index: 1;
      }
      .background2 {
        position: absolute;
        background-image: url('images/STARTUPS/tumblr_n889uglyGn1sh05g3o1_250.gif');
        background-size: repeat;
        margin-left: 250px;
        margin-right: 50px;
        height: calc(100% - 20px);
        width: 50%;
        z-index: 2;
        margin-top: 10px; margin-bottom: 10px;
      }
      .codeheader { 
        position: absolute;
        top: 0;
        left: 0;
        width: calc(100%; - 20px);
        height: 700px;
        background-image: url('images/green_code.gif');
        background-repeat: repeat-x;
        z-index: 10;
        border-radius: 25px;
        margin: 10px;
        opacity: 25%;
      }
      .glitch {
        margin: 10px;
        border-radius: 25px;
        width: calc(100%; - 20px);
        position: absolute;
        left: 0px;
        top: 0px;
        z-index:11;
      }
      .startup {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        position: absolute;
        z-index: 5; border-radius: 25px;
        border: 25px solid black;
      }
      .startup2 {
        position: absolute;
        margin: 5px;
        border-radius: 25px;
        z-index: 10;
        left: 10px;
        top: 10px;
        height: 95%;
      }
      .coding3 {
        position: absolute;
        top: 0px;
        right: 25px;
        width: 60px;
        height: calc(100% - 20px);
        background-image: url('../i.gifer.com/embedded/download/3Sgr.gif');
        background-repeat: repeat-y;
        margin: 10px;
        z-index: 3;
      }
      .eyes {
        position: absolute;
        left: 25px;
        top: 25px;
        z-index: 22;
      }
      .art2 {
        position: absolute;
        right: 25px;
        bottom: 25px;
        z-index: 22;
      }
      .ghost {
        position: absolute;
        right:10px;
        top:10px;
        border-radius: 25px;
        z-index: 22;
      }
      @media (max-width: 780px),
      (hover: none) and (pointer: coarse) {
        .fuzzy-overlay {
          visibility: hidden;
        }
        @keyframes shift {
          0% {
            transform: translateX(0%) translateY(0%);
          }
          0% {
            transform: translateX(0%) translateY(0%);
          }
        }
      }
      .topleftcorner { position: fixed; top: 0px; left: 0px; z-index: 9999999; }
      .toprightcorner { position: fixed; top: 2px; right: -2px; z-index: 9999999; transform: rotate(90deg); }
      .bottomleftcorner { position: fixed; bottom: 2px; left: -2px; z-index: 9999999; transform: rotate(270deg); }
      .bottomrightcorner { position: fixed; bottom: 0px; right: 0px; z-index: 9999999; transform: rotate(180deg); }
      .topborder { height: 10px; top: 0px; width: 100%; background-color: black; position: fixed; z-index: 9999999; }
      .bottomborder { height: 10px; bottom: 0px; width: 100%; background-color: black; position: fixed; z-index: 9999999; }
      .rightborder { width: 10px; right: 0px; height: 100%; background-color: black; position: fixed; z-index: 9999999; }
      .leftborder { width: 10px; left: 0px; height: 100%; background-color: black; position: fixed; z-index: 9999999; }
