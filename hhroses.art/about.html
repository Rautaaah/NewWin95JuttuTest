    <script>
      const jitter = document.getElementById('jittery'); //pixie jitter
      let targetX = 0,
        targetY = 0;
      let currentX = 0,
        currentY = 0;
      const amount = 1;
      const lerp = 0.06;
      const baseTransform = getComputedStyle(jitter).transform === "none" ? "" : getComputedStyle(jitter).transform; // fallback if not present in style attr
      function pickNewTarget() {
        targetX = (Math.random() - 0.5) * 4 * amount;
        targetY = (Math.random() - 0.5) * 4 * amount;
        setTimeout(pickNewTarget, 300);
      }
      pickNewTarget();
      function animate() {
        currentX += (targetX - currentX) * lerp;
        currentY += (targetY - currentY) * lerp;
        jitter.style.transform = `${baseTransform} translate(${currentX}px, ${currentY}px)`;
        requestAnimationFrame(animate);
      }
      animate();
      // other stuff
      window.addEventListener('load', function() {
        openApp('selfportrait');

            '.artwindow':     { left: 'calc(50vw + 300px)', top: 'calc(50vh - 20px)'  }
          }
        };
        function applyLayout() {
          var positions = window.innerHeight <= 929 ? layouts.short : layouts.tall;
          for (var selector in positions) {
            var els = document.querySelectorAll(selector);
            var el = els[els.length - 1];
            if (!el) continue;
            if (el.dataset.userMoved === 'true') continue;
            var props = positions[selector];
            for (var prop in props) el.style[prop] = props[prop];
      
            if (!el.dataset.dragListenerAttached) {
              el.dataset.dragListenerAttached = 'true';
              var grabTarget = el.querySelector('.title-bar');
              if (grabTarget) {
                var mark = function() { el.dataset.userMoved = 'true'; };
                grabTarget.addEventListener('mousedown', mark);
                grabTarget.addEventListener('touchstart', mark);
              }
            }
          }
        }
        setTimeout(applyLayout, 50);
        window.addEventListener('resize', applyLayout);
