    <script>
      var REGIONS = { 
        athensGreece: { label: "Athens, Greece",
                    url: "/src/galleries/travel-pics?region=athensGreece",
                    x: 51.5, y: 37.9 },
        montreal:    { label: "Montreal, Canada",
                    url: "/src/galleries/travel-pics?region=montreal",
                    x: 26.1, y: 34.7 },
        monroeNY:    { label: "Monroe, NY, USA",
                    url: "/src/galleries/travel-pics?region=monroeNY",
                    x: 25.5, y: 36.5 },
        nyc:         { label: "NY, NY, USA",
                    url: "/src/galleries/travel-pics?region=nyc",
                    x: 25.8, y: 37.7 },                    
        washingtonDC:{ label: "Washington DC, USA",
                    url: "/src/galleries/travel-pics?region=washingtonDC",
                    x: 24.5, y: 38.8 },
        
        florida:     { label: "Florida, United States",
                    url: "/src/galleries/travel-pics?region=florida",
                    x: 23.5, y: 42.9 },                    
        louisiana:   { label: "Lousiana, United States",
                    url: "/src/galleries/travel-pics?region=louisiana",
                    x: 21, y: 41.5 }
      };
      document.addEventListener("DOMContentLoaded", function() {
        setTimeout(function() {
          document.body.classList.add('second-cursor');
          var so = document.getElementById('startup-overlay');
          if (so) so.classList.add('hide');
        }, 4000);
        // Wait for the map image to load before placing markers...
        var mapImg = document.getElementById('map-image');
        if (mapImg.complete) setupMap();
        else mapImg.addEventListener('load', setupMap);
      });
      function setupMap() {
        var wrapper = document.getElementById('map-img-wrapper');
        var tooltip = document.getElementById('map-tooltip');
      // TEMP???: click anywhere on the map to log percentage coords in console mode ;D
        wrapper.addEventListener('click', function(e) {
          var rect = wrapper.getBoundingClientRect();
          var xPct = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
          var yPct = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
          console.log('Map coords: x=' + xPct + ', y=' + yPct);
        });
        // Place push pin for each region
        Object.keys(REGIONS).forEach(function(key) {
          var data = REGIONS[key];
          var dot = document.createElement('div');
          dot.className = 'map-marker';
          dot.style.left = data.x + '%';
          dot.style.top  = data.y + '%';
          dot.addEventListener('click', function() { openRegion(key); });
          dot.addEventListener('mousemove', function(e) {
            tooltip.textContent = data.label;
            tooltip.style.left = (e.clientX + 12) + 'px';
            tooltip.style.top  = (e.clientY + 12) + 'px';
            tooltip.classList.add('show');
          });
          dot.addEventListener('mouseleave', function() {
            tooltip.classList.remove('show');
          });
          wrapper.appendChild(dot);
        });
      }
      // Tracks open popups so the same region doesn't open twice
      var openPopups = {};
      var topZ = 1000;
      function openRegion(key) {
        var data = REGIONS[key];
        if (!data) return;
        if (openPopups[key]) {
          openPopups[key].dispatchEvent(new MouseEvent('mousedown'));
          openPopups[key].style.display = '';
          return;
        }
        // Cascade new windows 
        var count = Object.keys(openPopups).length;
        var offsetPx = count * 30;
        var win = document.createElement('div');
        win.className = 'travel-popup window';
        if (offsetPx > 0) {
          win.style.left = 'calc(50vw - 350px + ' + offsetPx + 'px)';
          win.style.top  = 'calc(50vh - 250px + ' + offsetPx + 'px)';
        }
        topZ++;
        win.style.zIndex = topZ;
        win.innerHTML =
          '<div class="title-bar">' +
            '<img src="https://hhroses.neocities.org/images/icons/find-folder-16x16.png">' +
            '<div class="title-bar-text">' + data.label + '</div>' +
            '<div class="title-bar-controls">' +
              '<button aria-label="Minimize"></button>' +
              '<button aria-label="Maximize"></button>' +
              '<button aria-label="Close"></button>' +
            '</div>' +
          '</div>' +
          '<div class="window-body">' +
            '<iframe src="' + data.url + '&title=' + encodeURIComponent(data.label) + '" loading="lazy"></iframe>' +
          '</div>';
        var winObj = new Window(win);
        winObj.open();
        openPopups[key] = winObj.elem;
        if (winObj.closeBtn) {
          var origClose = winObj.close;
          winObj.closeBtn.onclick = function() {
            origClose();
            delete openPopups[key];
          };
        }
      }
      function scrollToSection(id) {
        var anchor = document.getElementById(id);
        if (anchor) anchor.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      // GNOME SOUND effect 
      (function() {
        var coinSound = new Audio('https://hhroses.neocities.org/audio/Gnome-sound-effect.mp3');
        coinSound.volume = 0.5; 
        coinSound.currentTime = 1;
        var triggers = document.querySelectorAll(
          '.coin-hotspot, .QuarterHead, .QuarterHeads, .DollarCoin, .DollarCoinB'
        );
        var timer = null;
        var isHovering = false;
        function checkHover() {
          var anyHovered = Array.prototype.some.call(triggers, function(el) {
            return el.matches(':hover');
          });
          if (anyHovered && !isHovering) {
            isHovering = true;
            timer = setTimeout(function() {
              coinSound.currentTime = 0;
              coinSound.play().catch(function(){}); // ignore autoplay errors
            }, 0); // when the sound starts
          } else if (!anyHovered && isHovering) {
            isHovering = false;
            if (timer) { clearTimeout(timer); timer = null; }
          }
        }
        triggers.forEach(function(el) {
          // setTimeout 0 lets the next element's :hover register before we check
          el.addEventListener('mouseenter', function() { setTimeout(checkHover, 0); });
          el.addEventListener('mouseleave', function() { setTimeout(checkHover, 0); });
        });
      })();
      // Reset scroll when crossing the mobile/desktop breakpoint
      let wasMobileLayout = window.innerWidth <= 780;
      window.addEventListener('resize', function() {
        var isMobileLayout = window.innerWidth <= 780;
        if (wasMobileLayout !== isMobileLayout) {
          window.scrollTo(0, 0);
        }
        wasMobileLayout = isMobileLayout;
      });
