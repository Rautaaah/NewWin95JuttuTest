    <script>
      var books = {
        buzzlove: {
          idle: 'https://hhroses.art/images/books/InLoveWithaBug1.png',
          hover: 'https://hhroses.art/images/books/InLoveWithaBug3.png',
          iframeSrc: 'https://hhroses.art/my-documents/InLoveWithABug/in-love-with-a-bug-book.html',
          buyLink: 'https://tinyurl.com/HHRosesOnAmazon'
        },
        pixies: {
          idle: 'https://hhroses.art/images/books/pixiebookanimation1.png',
          hover: 'https://hhroses.art/images/books/pixiebookanimation.gif',
          iframeSrc: '',
          buyLink: ''
        }
      };
      // Set default book on load
      var currentBook = 'buzzlove';
      function switchBook(bookKey) {
        currentBook = bookKey;
        var display = document.getElementById('mainBookDisplay');
        var book = books[bookKey];
        display.style.backgroundImage = "url('" + book.idle + "')";
        display.onmouseenter = function() {
          display.style.backgroundImage = "url('" + book.hover + "')";
          display.style.cursor = "url('cursors/pointer.png'), pointer";
        };
        display.onmouseleave = function() {
          display.style.backgroundImage = "url('" + book.idle + "')";
        };
      }
      function openCurrentBook() {
        var book = books[currentBook];
        if (!book.iframeSrc) return;
        playBookClose2();
        var container = document.getElementById('book-container');
        var iframe = container.querySelector('iframe');
        iframe.src = book.iframeSrc;
        var buyBtn = container.querySelector('#buyBtn');
        if (buyBtn && buyBtn.parentElement.tagName === 'A') {
          buyBtn.parentElement.href = book.buyLink;
        }
        container.style.setProperty('display', 'block', 'important');
        container.style.animation = 'none';
        container.offsetHeight;
        container.style.animation = 'slamIn 0.4s cubic-bezier(0.22, 0.6, 0.36, 1) forwards';
        container.style.zIndex = '2147483647';
        container.onmousedown = function(e) {
        };
        document.querySelector('.booksby').style.top = 'calc(50vh - 450px)';
        document.querySelector('.hhroses').style.top = 'calc(50vh - 380px)';
        if (window.innerWidth > 780) {
          document.querySelector('.bookcase').style.opacity = '0';
        }
      } 
      function closeBookPopup() {
        var container = document.getElementById('book-container');
        playBookClose2();
        container.style.animation = 'none';
        container.offsetHeight;
        container.style.animation = 'slamOut 0.4s cubic-bezier(0.22, 0.6, 0.36, 1) forwards';
        setTimeout(function() {
          container.style.setProperty('display', 'none', 'important');
          container.style.animation = 'none';
          document.querySelector('.booksby').removeAttribute('style');
          document.querySelector('.hhroses').removeAttribute('style');
          document.querySelector('.bookcase').style.opacity = '1';
        }, 400);
      }
      // Set default book on load
      switchBook('buzzlove');
      // to make book links 
      function openFromBookHash() {
        var hash = window.location.hash.substring(1);
        if (hash && books[hash]) {
          switchBook(hash);
          openCurrentBook();
        }
      }
      window.addEventListener('load', openFromBookHash);
      window.addEventListener('hashchange', openFromBookHash);
      // for book poll
      window.addEventListener('load', function() {
        openApp('bookpoll');
        setTimeout(function() {
          var els = document.querySelectorAll('.poll');
          var el = els[els.length - 1];
          if (el) {
            el.style.left = 'calc(50vw - 170px)';
            el.style.top = 'calc(50vh - 238px)';
            el.style.zIndex = '5';
          }
        }, 50);
      });  
      //sound effects
      function playError() {
        const sound = document.getElementById('errorsound');
        sound.currentTime = 0;
        sound.play().catch(e => console.log("Audio playback failed:", e));
      }
      function playBookClose() {
        const sound = document.getElementById('bookclose1');
        sound.currentTime = 0;
        sound.play().catch(e => console.log("Audio playback failed:", e));
      }
      function playBookClose2() {
