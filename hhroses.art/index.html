  <style>

    /* =========================================================
       GENERAL
    ========================================================= */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --crt-red: rgb(218, 49, 49);
      --crt-green: rgb(112, 159, 115);
      --crt-blue: rgb(40, 129, 206);

      --ActiveTitle: #000080;
      --GradientActiveTitle: #1084d0;
      --InactiveTitle: #808080;
      --GradientInactiveTitle: #b5b5b5;
      --TitleText: #ffffff;
      --InactiveTitleText: #c0c0c0;

      --Background: #008080;
      --Window: #ffffff;
      --WindowText: #000000;
      --ButtonFace: #c0c0c0;
      --ButtonHilight: #ffffff;
      --ButtonShadow: #808080;
      --ButtonDkShadow: #000000;
      --ButtonText: #000000;
      --Hilight: #000080;
      --HilightText: #ffffff;
      --GrayText: #808080;
    }

    @font-face {
      font-family: 'basiic';
      src: url(https://cinni.net/fonts/basiic.ttf);
    }

    @font-face {
      font-family: 'CelticBitThin';
      src:
        url(https://hhroses.neocities.org/font/CelticBitThin.woff) format('woff'),
        url(https://hhroses.neocities.org/font/CelticBitThin.ttf) format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: "ComicSans";
      src: url("https://hhroses.neocities.org/font/Ldfcomicsans-jj7l.ttf")
           format("truetype");
    }

    /* =========================================================
       CRT EFFECT
    ========================================================= */

    .crt::before,
    .crt::after,
    body::before,
    body::after {
      position: fixed;
      content: "";
      pointer-events: none;
      opacity: .2;
      mix-blend-mode: overlay;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 900 !important;
    }

    .crt::before,
    body::before {
      background: repeating-linear-gradient(
        var(--crt-red) 0px,
        var(--crt-green) 2px,
        var(--crt-blue) 4px
      );
    }

    .crt::after,
    body::after {
      background: repeating-linear-gradient(
        90deg,
        var(--crt-red) 1px,
        var(--crt-green) 2px,
        var(--crt-blue) 3px
      );
    }

    /* =========================================================
       BACKGROUND
    ========================================================= */

    .fuzzy-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-image: url("images/noise2.jpg");
      opacity: 0;
      z-index: 9999999999 !important;
      pointer-events: none;
      animation: shift 0.2s linear infinite both;
    }

    @keyframes shift {
      0% {
        transform: translateX(10%) translateY(10%);
      }

      100% {
        transform: translateX(-10%) translateY(-10%);
      }
    }

    .overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;

      background:
        url('images/backgrounds/pixel-star-background.gif')
        top right repeat;

      z-index: 1;
      mix-blend-mode: screen;
      opacity: 1;
      pointer-events: none;
    }

    .gradient {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0) 30%,
          rgba(255,255,255,1) 1000%
        );

      z-index: 1;
      pointer-events: none;
    }

    body {
      font-family: 'CelticBitThin', sans-serif;

      background-image:
        url('images/backgrounds/seamlessgalaxy3.jpg');

      background-attachment: fixed;
      background-color: black;

      overflow-x: hidden;
      overflow-y: auto;

      margin: 0;
      padding: 0;

      cursor: url('cursors/default.png'), default;

      width: 100%;
      min-height: 3500px;
    }

    /* =========================================================
       DECORATIVE BACKGROUND
    ========================================================= */

    .coolcode {
      position: fixed !important;

      background-image: url('images/green_code.gif');

      width: 100%;
      height: 400px;

      z-index: -3;
      top: -100px;

      pointer-events: none;

      -webkit-mask-image:
        linear-gradient(to bottom, black 30%, transparent 100%);

      mask-image:
        linear-gradient(to bottom, black 30%, transparent 100%);

      transition: top 1s ease;
    }

    .clouds {
      position: absolute !important;

      background-image:
        url('images/frutiger-aero/clouds_25.png');

      background-size: contain;
      background-repeat: no-repeat;

      width: 100%;
      min-width: 100%;
      height: 100vh;

      z-index: -5;

      top: 125px;
      bottom: 0;

      pointer-events: none;

      -webkit-mask-image:
        linear-gradient(to bottom, black 30%, transparent 90%);

      mask-image:
        linear-gradient(to bottom, black 30%, transparent 90%);

      transition: opacity 1s ease;
    }

    #fluid-canvas {
      position: fixed;
      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      z-index: 9999999999 !important;
      pointer-events: none;
    }

    /* =========================================================
       CURSORS / IMAGES
    ========================================================= */

    a,
    #button {
      cursor: url('cursors/pointer.png'), pointer;
    }

    img:hover {
      scale: 1.01;
    }

    img.outlined {
      -webkit-filter:
        drop-shadow(2px 2px 0 white)
        drop-shadow(-2px 2px 0 white)
        drop-shadow(2px -2px 0 white)
        drop-shadow(-2px -2px 0 white)
        drop-shadow(0 0 2px white)
        drop-shadow(0 0 5px white);

      filter:
        drop-shadow(2px 2px 0 white)
        drop-shadow(-2px 2px 0 white)
        drop-shadow(2px -2px 0 white)
        drop-shadow(-2px -2px 0 white)
        drop-shadow(0 0 2px white)
        drop-shadow(0 0 5px white);
    }

    /* =========================================================
       GNOME
    ========================================================= */

    .gnome {
      z-index: 999;

      position: absolute;

      max-width: 10%;
      max-height: 10%;

      cursor: url('cursors/pointer.png'), pointer;

      filter:
        drop-shadow(0 0 3px white) !important;
    }

    .gnome:hover {
      scale: 1.1 !important;
    }

    /* =========================================================
       MAIN WELCOME SCREEN
    ========================================================= */

    .maincontent {
      height: 85vh !important;
      width: 100%;

      position: absolute;

      text-align: center;

      margin-left: auto;
      margin-right: auto;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      z-index: 2;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;
    }

    .computer {
      width: auto;
      max-width: 418px !important;
      max-height: 40vh;

      margin: 10px auto 0 auto;

      display: block;

      vertical-align: top;

      filter:
        drop-shadow(0 0 25px white);
    }

    .maincontent span {
      background-color: rgba(214,195,196,.5);

      font-family: 'CelticBitThin', sans-serif;

      text-align: center;

      margin: -10px auto 0 auto !important;

      font-size: 16px;
      height: 16px;
    }

    .textbox {
      width: auto;
      max-width: 95%;
      height: auto;
      max-height: 20vh;

      filter:
        drop-shadow(0 0 5px rgba(0,0,0,1));
    }

    .webring {
      position: relative;

      transform:
        translateX(185px)
        translateY(-30px);

      padding: none;
      margin-bottom: -100px;
    }

    .enterbutton {
      text-align: center;

      margin-left: auto;
      margin-right: auto;

      display: block;

      width: 300px;
      max-width: 100%;
      height: auto;
    }

    .enterbutton img {
      position: relative;

      width: 150px;
      height: auto;

      margin: 0 auto;
      margin-bottom: 20px;

      padding: 0;

      z-index: 0;

      filter:
        drop-shadow(0 0 3px black) !important;
    }

    .enterbutton:hover {
      background-image:
        url('images/misc/comicexplode.png');

      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;

      transition:
        opacity 1s ease,
        background-color 1s ease,
        background-image 1s ease;

      z-index: 0;
    }

    /* =========================================================
       GRASS
    ========================================================= */

    .grass {
      position: fixed !important;

      background-image:
        url('images/frutiger-aero/foregrounds_73.png');

      width: 100%;
      height: 248px;

      pointer-events: none;

      z-index: 999;

      bottom: -160px;
      left: 0;
    }

    /* =========================================================
       FLYING FAIRY
    ========================================================= */

    .flier {
      pointer-events: none;
      z-index: 9999999 !important;
    }

    .flier > * {
      animation: fly 50s linear infinite;

      pointer-events: none !important;

      top: 0;
      left: 0;

      transform:
        translateX(-120%)
        translateY(-120%)
        rotateZ(0);

      position: fixed;

      animation-delay: 1s;

      z-index: 999999;

      filter:
        drop-shadow(0 0 3px white) !important;
    }

    @keyframes fly {

      98.001%,
      0% {
        display: block;

        transform:
          translateX(-200%)
          translateY(100vh)
          rotateZ(0deg);
      }

      15% {
        transform:
          translateX(100vw)
          translateY(-100%)
          rotateZ(180deg);
      }

      15.001%,
      18% {
        transform:
          translateX(100vw)
          translateY(-30%)
          rotateZ(0deg);
      }

      40% {
        transform:
          translateX(-200%)
          translateY(3vh)
          rotateZ(-180deg);
      }

      40.001%,
      43% {
        transform:
          translateX(-200%)
          translateY(-100%)
          rotateZ(-180deg);
      }

      65% {
        transform:
          translateX(100vw)
          translateY(50vh)
          rotateZ(0deg);
      }

      65.001%,
      68% {
        transform:
          translateX(20vw)
          translateY(-200%)
          rotateZ(180deg);
      }

      95% {
        transform:
          translateX(10vw)
          translateY(100vh)
          rotateZ(0deg);
      }
    }

    /* =========================================================
       PAGE 2
    ========================================================= */

    .page2_wrap {
      position: absolute;

      top: 100vh;

      width: 100%;

      z-index: 98;

      padding-bottom: 100px;
    }

    /* =========================================================
       VR TRAIN + CAT PHOTO WINDOWS
    ========================================================= */

    .photo-window {
      margin: 10px auto;

      width: 500px;
      max-width: 90%;

      font-family: Times, serif;
      font-weight: 900;

      background: #c3c3c3;

      z-index: 98;

      border-top: 1px solid white;
      border-left: 1px solid white;
      border-right: 1px solid black;
      border-bottom: 1px solid black;

      box-shadow:
        inset -1px -1px #808080;

      letter-spacing: 1px;

      padding: 2px;
    }

    .photo-window .title-bar {
      height: 18px;
      text-align: left !important;
    }

    .photo-window .title-bar-text {
      flex-grow: 1;

      padding-left: 5px;
      padding-top: 3px;

      text-shadow: none;

      text-align: left !important;
    }

    .photo-window .window-body {
      margin: 3px 2px 2px 1px;

      border-top: 1px solid black;
      border-left: 1px solid black;
      border-right: 1px solid #c3c3c3;
      border-bottom: 1px solid #c3c3c3;

      box-shadow:
        inset 1px 1px #808080,
        1px 1px white;

      padding: 10px;

      background: white;

      text-align: center;
    }

    .photo-title {
      font-family: 'ComicSans', Arial, sans-serif;

      font-size: 22px;

      margin: 5px 0 10px;

      text-shadow:
        1px 1px white,
        -1px -1px #808080;
    }

    .photo-subtitle {
      font-family: 'ComicSans', Arial, sans-serif;

      font-size: 14px;

      margin-bottom: 10px;

      color: #333;
    }

    .random-photo {
      display: block;

      width: 100%;
      max-width: 460px;

      height: 300px;

      object-fit: contain;

      margin: 0 auto 10px;

      background: #000;

      border:
        4px inset #808080;

      image-rendering: auto;

      transition:
        transform .15s ease;
    }

    .random-photo:hover {
      transform: scale(1.015);
    }

    .photo-caption {
      font-family: 'ComicSans', Arial, sans-serif;

      font-size: 15px;

      margin: 8px;
      min-height: 20px;

      color: #111;
    }

    .photo-button {
      font-family: 'ComicSans', Arial, sans-serif;

      font-size: 14px;

      padding: 5px 12px;

      margin-top: 4px;

      cursor:
        url('cursors/pointer.png'),
        pointer;
    }

    .photo-number {
      font-family: 'basiic', sans-serif;

      font-size: 12px;

      margin-top: 7px;

      color: #555;
    }

    /* =========================================================
       PRIVACY / TERMS
    ========================================================= */

    div.termsAndPolicy {
      margin: 10px auto;

      width: 300px !important;

      padding: 5px;

      border-top: 1px solid white;
      border-left: 1px solid white;
      border-right: 1px solid #808080;
      border-bottom: 1px solid #808080;

      box-shadow:
        1px 1px black;

      background: #c3c3c3;

      display: grid;
      align-content: end;

      text-align: center;

      font-size: 14px;

      z-index: 9;

      text-shadow:
        1px 1px white,
        -1px -1px rgba(0,0,0,.25);
    }

    div.termsAndPolicy div {
      width: 100%;

      background: white;

      box-shadow:
        inset 1px 1px black,
        inset 2px 2px #808080,
        inset -1px -1px #c3c3c3,
        1px 1px white;

      justify-content: center;
      align-items: center;

      display: flex;

      gap: 10px;

      padding: 10px;
    }

    /* =========================================================
       NEOCITIES
    ========================================================= */

    .neocities {
      margin: 10px auto !important;

      border: 10px solid white;
      border-radius: 25px;

      box-shadow:
        1px 1px pink,
        2px 2px white,
        -1px -1px #808080,
        -2px -2px black;
    }

    .neocities:hover {
      scale: 1;
      cursor:
        url('cursors/pointer.png'),
        pointer;
    }

    /* =========================================================
       LANGUAGE BOX
    ========================================================= */

    .languages_wrap_wrap {
      font-family: Arial;

      margin: 5px auto;

      width: 185px;

      padding: 5px;

      border-top: 1px solid white;
      border-left: 1px solid white;
      border-right: 1px solid #808080;
      border-bottom: 1px solid #808080;

      box-shadow:
        1px 1px black;

      background: #c3c3c3;

      display: grid;
      align-content: end;

      text-align: center;

      font-size: 14px;

      z-index: 99;

      text-shadow:
        1px 1px white,
        -1px -1px rgba(0,0,0,.25);
    }

    .skiptranslate,
    iframe.skiptranslate,
    .goog-te-banner-frame {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
    }

    body {
      top: 0 !important;
      position: static !important;
    }

    .gtranslate_wrapper {
      margin: 5px auto !important;

      filter:
        drop-shadow(1px 1px white)
        drop-shadow(-1px -1px rgba(0,0,0,.25));
    }

    .gtranslate_wrapper *::-webkit-scrollbar {
      width: 16px;
    }

    .gtranslate_wrapper *::-webkit-scrollbar-track {
      background: #dfdfdf;

      border-left: 1px solid #fff;
      border-top: 1px solid #fff;
    }

    .gtranslate_wrapper *::-webkit-scrollbar-thumb {
      background: #c0c0c0;

      box-shadow:
        inset 1px 1px #fff,
        inset -1px -1px #0a0a0a,
        inset 2px 2px #dfdfdf,
        inset -2px -2px #808080;
    }

    .gtranslate_wrapper *::-webkit-scrollbar-button {
      display: none;
    }

    .gtranslate_wrapper * {
      scrollbar-width: thin;

      scrollbar-color:
        #c0c0c0
        #dfdfdf;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-height: 810px),
           (max-width: 700px) {

      .webring {
        transform: none;

        margin: 10px 0 -15px 0;
      }

      .random-photo {
        height: 250px;
      }

      .photo-title {
        font-size: 18px;
      }
    }

  </style>
</head>

      id="gnome"
      src="images/little_gnome.png"

      style="

        max-height:10%;
        z-index:999;
      "
    >

  </div>


  <!-- =======================================================
       GNOME + DAY/NIGHT JAVASCRIPT
  ======================================================== -->

  <script>

    window.onload = function() {
      move();
    };


    function move() {

      const img =
        document.getElementById('gnome');

      img.style.left =
        Math.floor(Math.random() * window.innerWidth) + "px";

      img.style.top =
        Math.floor(Math.random() * window.innerHeight) + "px";
    }


    function playsound() {

      const sfx =
        document.getElementById("sfx");

      sfx.autoplay = true;

      sfx.load();
    }


    /* =======================================================
       DAY / NIGHT BACKGROUND
    ======================================================== */

    const hour = new Date().getHours();

    if (hour >= 20 || hour < 6) {

      document.body.style.backgroundImage =
        "url('images/backgrounds/seamlessgalaxy3.jpg')";

    } else {

      document.body.style.backgroundImage =
        "url('images/pink_clouds.jpg')";

      document.querySelector('.coolcode').style.top = "0px";

    }

  </script>

        </div>

        <div class="title-bar-controls">

      document.getElementById(

        "Train photo " +
        (index + 1) +

        vrTrainPhotos.length;

    }

    const catPhotos = [

      document.getElementById(
