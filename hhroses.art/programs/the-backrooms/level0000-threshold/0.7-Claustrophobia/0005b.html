      }
      .splash > img {
        position : fixed;
        top: 0px;
        left: 0px;

        left: 50%;
        transform: translateX(calc(-50% - 0px));
        z-index: 99;
        box-shadow: inset 0 0 $blur-radius $spread-radius;
        z-index: 9999999 !important;
        cursor: url('https://hhroses.neocities.org/cursors/wait.png'), wait;

        top: 0;
        left: 0;

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Set initial positions (these can be overridden by drag)
        var positions = {
          'explorernotfoundpage': { left: 'calc(50vw - 290px)', top: 'calc(50vh - 400px)' }
        };
        for (var id in positions) {
          var el = document.getElementById(id);
          if (el) {
            el.style.left = positions[id].left;
            el.style.top = positions[id].top;
          }
        }
        // For generated windows, wait a bit then position them
        setTimeout(function() {
          var generatedPositions = {
            'chat': { left: 'calc(50vw - 670px)', top: 'calc(50vh - 150px)' },
            'MSPaint': { left: 'calc(50vw - 500px)', top: 'calc(50vh - 335px)' }
          };
          // Find windows by class since IDs change after cloning
          var chatWin = document.querySelector('.chat');
          var mspaintWin = document.querySelector('.MSPaintwindow');
          if (chatWin) {
            chatWin.style.left = generatedPositions['chat'].left;
            chatWin.style.top = generatedPositions['chat'].top;
          }
          if (mspaintWin) {
            mspaintWin.style.left = generatedPositions['MSPaint'].left;
            mspaintWin.style.top = generatedPositions['MSPaint'].top;
          }
        }, 100);
      });
      function playError() {
        const sound = document.getElementById('errorsound');
        sound.currentTime = 0;
        sound.play().catch(e => console.log("Audio playback failed:", e));
      }
      // splash screen 
      var splashScreen = document.querySelector('.splash');
      addEventListener("load", function(){
        setTimeout(function() { 
            var load_screen = document.getElementById("load_screen");
            document.body.removeChild(load_screen);
        }, 3000);
      });
      // Reset scroll when crossing the mobile/desktop breakpoint
      let wasMobileLayout = window.innerWidth <= 780;
      window.addEventListener('resize', function() {
        var isMobileLayout = window.innerWidth <= 780;
        if (wasMobileLayout !== isMobileLayout) {
          window.scrollTo(0, 0);
        }
        wasMobileLayout = isMobileLayout;
      });
